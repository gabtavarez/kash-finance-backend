spring:
  application:
    name: kash-finance

  datasource:
    url: jdbc:postgresql://localhost:5432/fluxo_db
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    hibernate:
      ddl-auto: validate # Deixe validate se for usar Flyway, ou update para prototipação rápida
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081